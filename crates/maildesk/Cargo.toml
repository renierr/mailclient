[package]
name = "maildesk"
version.workspace = true
edition = "2021"

# egui desktop client (product track, graduates the maildesk-spike findings).
# Pure Rust over mailcore: no Qt, no cxx-qt, no QML. Offline dev against
# MAILCLIENT_DB (default ./data/dev.sqlite); refuses the platform mailbox.

[[bin]]
name = "maildesk"
path = "src/main.rs"

[dependencies]
mailcore = { path = "../mailcore" }
# Same major as the spike (proven Wayland-native on this machine).
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "links"] }
egui = "0.36"
# Same-version sibling crates (approved): layout strips + tables for the
# reader/list, docking tabs for open messages.
egui_extras = "0.36"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
