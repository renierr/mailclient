[package]
name = "mailcore"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust core of mailclient: SQLite storage, models, sync engine. No Qt dependency."
license = "MIT OR Apache-2.0"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }
thiserror = "2.0"
log = "0.4"
directories = "6.0"
tokio = { version = "1.0", features = ["full"] }
# Mail protocols (wired up in Milestone 1-2; versions pinned early on purpose)
lettre = "0.11"
imap = "2.4"
native-tls = "0.2"
mail-parser = "0.11"

# Keyring backend is per-OS: the `keyring` crate compiles to a useless mock
# store unless exactly one platform feature is enabled, and each feature only
# builds on its own OS -- hence one target-scoped dependency per platform
# rather than a feature list on a single entry.
#
# Linux: Secret Service (freedesktop) for persistent desktop keyring entries
# visible in GNOME Passwords / KDE Wallet. (Plain `linux-native` would be the
# invisible, non-persistent kernel keyutils store.)
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent"] }

# Windows: Credential Manager (the "Windows Credentials" vault).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# macOS: the login Keychain.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3.0"
dotenvy = "0.15"
env_logger = "0.11"
